<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 690" role="img" aria-label="总体概览：从研究想法，到正式结果"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><style>text{font-family:"Microsoft YaHei","微软雅黑",sans-serif;font-style:normal}.node{cursor:pointer}.node:focus{outline:none}.node:focus-visible>rect:first-of-type{stroke-dasharray:4 3}.dim{opacity:.17}.highlight>rect:first-of-type{stroke-width:4}.edge{transition:opacity .15s}</style><rect width="1120" height="690" rx="20" fill="#f8fafc"/><g class="edge" data-from="human" data-to="rd"><path d="M295,100 L430,100" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="331.5" y="78" width="62" height="19" rx="5" fill="#f8fafc"/><text x="362.5" y="92" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">确认约定</text></g><g class="edge" data-from="human" data-to="entry"><path d="M175,145 L175,275" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="132" y="188" width="86" height="19" rx="5" fill="#f8fafc"/><text x="175" y="202" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">直接研究也可</text></g><g class="edge" data-from="rd" data-to="entry"><path d="M430,100 L330,100 L330,247 L175,247 L175,275" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="241" y="199" width="62" height="19" rx="5" fill="#f8fafc"/><text x="272" y="213" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">提交候选</text></g><g class="edge" data-from="entry" data-to="pit"><path d="M295,320 L430,320" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="331.5" y="298" width="62" height="19" rx="5" fill="#f8fafc"/><text x="362.5" y="312" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">检查数据</text></g><g class="edge" data-from="data" data-to="pit"><path d="M925,145 L925,207 L550,207 L550,275" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="726" y="177" width="98" height="19" rx="5" fill="#f8fafc"/><text x="775" y="191" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">来源与历史信息</text></g><g class="edge" data-from="pit" data-to="compute"><path d="M670,320 L805,320" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="700.5" y="298" width="74" height="19" rx="5" fill="#f8fafc"/><text x="737.5" y="312" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">准入后执行</text></g><g class="edge" data-from="compute" data-to="result"><path d="M925,365 L925,495" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="906" y="408" width="38" height="19" rx="5" fill="#f8fafc"/><text x="925" y="422" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">封存</text></g><g class="edge" data-from="result" data-to="delivery"><path d="M805,540 L670,540" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="694.5" y="518" width="86" height="19" rx="5" fill="#f8fafc"/><text x="737.5" y="532" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">读取正式结果</text></g><g class="edge" data-from="delivery" data-to="report"><path d="M430,540 L295,540" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="331.5" y="518" width="62" height="19" rx="5" fill="#f8fafc"/><text x="362.5" y="532" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">直接交付</text></g><g class="edge" data-from="delivery" data-to="rd"><path d="M550,585 L550,640 L25,640 L25,190 L550,190 L550,145" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="196" y="162" width="98" height="19" rx="5" fill="#f8fafc"/><text x="245" y="176" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">仅开发指标反馈</text></g><g class="node" data-id="human" tabindex="0" role="button" aria-pressed="false" aria-label="你：问题与研究约定"><title>人确认公式含义、窗口、可用时点、研究范围与预算。AI 草稿不能代替人的确认。</title><rect x="55" y="55" width="240" height="90" rx="12" fill="white" stroke="#b45309" stroke-width="1.5"/><rect x="55" y="70" width="4" height="60" rx="2" fill="#b45309"/><text x="73" y="90" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">你：问题与研究约定</text><text x="73" y="117" font-size="13" fill="#475569" font-weight="400" text-anchor="start">确认公式 · 数据范围 · 预算</text><circle cx="281" cy="69" r="3" fill="#b45309"/></g><g class="node" data-id="rd" tabindex="0" role="button" aria-pressed="false" aria-label="AI 研究助手 · RD-Agent"><title>可选集成，位于框架核心之外。公式复现固定定义；探索模式仅使用成功 Result 的开发指标，test/holdout 不进入反馈。</title><rect x="430" y="55" width="240" height="90" rx="12" fill="white" stroke="#7c3aed" stroke-width="1.5"/><rect x="430" y="70" width="4" height="60" rx="2" fill="#7c3aed"/><text x="448" y="90" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">AI 研究助手 · RD-Agent</text><text x="448" y="117" font-size="13" fill="#475569" font-weight="400" text-anchor="start">提取定义 · 提案 · 代码与反思</text><circle cx="656" cy="69" r="3" fill="#7c3aed"/></g><g class="node" data-id="data" tabindex="0" role="button" aria-pressed="false" aria-label="你的研究数据"><title>数据由使用者提供。归档快照与数据库是互斥来源；历史可见性必须有相应字段和来源说明。</title><rect x="805" y="55" width="240" height="90" rx="12" fill="white" stroke="#087f8c" stroke-width="1.5"/><rect x="805" y="70" width="4" height="60" rx="2" fill="#087f8c"/><text x="823" y="90" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">你的研究数据</text><text x="823" y="117" font-size="13" fill="#475569" font-weight="400" text-anchor="start">只读数据库 / 已封存行情</text><circle cx="1031" cy="69" r="3" fill="#087f8c"/></g><g class="node" data-id="entry" tabindex="0" role="button" aria-pressed="false" aria-label="研究入口 · Workspace"><title>Workspace 共用正式主链，同次解析和编译后直接交接准入与执行。独立 package lint 是主动诊断入口。</title><rect x="55" y="275" width="240" height="90" rx="12" fill="white" stroke="#2563eb" stroke-width="1.5"/><rect x="55" y="290" width="4" height="60" rx="2" fill="#2563eb"/><text x="73" y="310" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">研究入口 · Workspace</text><text x="73" y="337" font-size="13" fill="#475569" font-weight="400" text-anchor="start">一次准备与准入 → 执行</text><circle cx="281" cy="289" r="3" fill="#2563eb"/></g><g class="node" data-id="pit" tabindex="0" role="button" aria-pressed="false" aria-label="数据与时点检查"><title>Catalog 描述字段及来源；准入绑定来源和时点。取数时复查来源，按决策时点限制数据。PIT 不证明供应商没有修订历史。</title><rect x="430" y="275" width="240" height="90" rx="12" fill="white" stroke="#15803d" stroke-width="1.5"/><rect x="430" y="290" width="4" height="60" rx="2" fill="#15803d"/><text x="448" y="310" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">数据与时点检查</text><text x="448" y="337" font-size="13" fill="#475569" font-weight="400" text-anchor="start">数据目录 · 可见日期 · 来源变化</text><circle cx="656" cy="289" r="3" fill="#15803d"/></g><g class="node" data-id="compute" tabindex="0" role="button" aria-pressed="false" aria-label="模型计算与策略回测"><title>Runtime 调度依赖图、资源与检查点。Qlib 提供模型、处理器和表达式；日线与一分钟策略由 LEAN 执行，使用当时可见的数据及市场规则。</title><rect x="805" y="275" width="240" height="90" rx="12" fill="white" stroke="#2563eb" stroke-width="1.5"/><rect x="805" y="290" width="4" height="60" rx="2" fill="#2563eb"/><text x="823" y="310" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">模型计算与策略回测</text><text x="823" y="337" font-size="13" fill="#475569" font-weight="400" text-anchor="start">Qlib 模型 · LEAN 交易</text><circle cx="1031" cy="289" r="3" fill="#2563eb"/></g><g class="node" data-id="result" tabindex="0" role="button" aria-pressed="false" aria-label="正式结果包 · Result"><title>应用服务在节点完成后调用 ResultAssembler，原子发布正式表、指标与实现引用。默认记录只读来源，--persist-inputs 才保存查询输入。</title><rect x="805" y="495" width="240" height="90" rx="12" fill="white" stroke="#087f8c" stroke-width="1.5"/><rect x="805" y="510" width="4" height="60" rx="2" fill="#087f8c"/><text x="823" y="530" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">正式结果包 · Result</text><text x="823" y="557" font-size="13" fill="#475569" font-weight="400" text-anchor="start">来源 · 配置 · 代码 · 数值表</text><circle cx="1031" cy="509" r="3" fill="#087f8c"/></g><g class="node" data-id="delivery" tabindex="0" role="button" aria-pressed="false" aria-label="直接读取 · ResultContext"><title>直接读取正式 Result，交付 snapshot、metrics、claim_level、limitations 和研究成本假设。成功 Result 的开发指标供 AI 反馈；报告不是反馈的前置步骤。</title><rect x="430" y="495" width="240" height="90" rx="12" fill="white" stroke="#15803d" stroke-width="1.5"/><rect x="430" y="510" width="4" height="60" rx="2" fill="#15803d"/><text x="448" y="530" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">直接读取 · ResultContext</text><text x="448" y="557" font-size="13" fill="#475569" font-weight="400" text-anchor="start">指标 · 声明 · 限制</text><circle cx="656" cy="509" r="3" fill="#15803d"/></g><g class="node" data-id="report" tabindex="0" role="button" aria-pressed="false" aria-label="报告与实验比较"><title>报告、比较、分析和导出直接消费 Result。模型报告使用 Qlib，组合和策略报告读取 LEAN 正式表；报告失败只重试报告。</title><rect x="55" y="495" width="240" height="90" rx="12" fill="white" stroke="#b45309" stroke-width="1.5"/><rect x="55" y="510" width="4" height="60" rx="2" fill="#b45309"/><text x="73" y="530" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">报告与实验比较</text><text x="73" y="557" font-size="13" fill="#475569" font-weight="400" text-anchor="start">读结论，也能追到来源</text><circle cx="281" cy="509" r="3" fill="#b45309"/></g></svg>
