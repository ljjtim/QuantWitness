<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="总体概览" font-family="Microsoft YaHei, 微软雅黑" font-weight="400"><title>总体概览</title><desc>研究声明、一次准入、执行与直接交付。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#f1f5f9"/><text x="40" y="45" font-size="28" font-weight="700" fill="#0f172a">总体概览</text><text x="40" y="80" font-size="15" fill="#475569">研究声明、一次准入、执行与直接交付。</text><path d="M360,165 L834,165" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="597" y="157" text-anchor="middle" font-size="12" fill="#334155">确认范围</text><path d="M760,165 L834,165" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="797" y="157" text-anchor="middle" font-size="12" fill="#334155">候选</text><path d="M1000,205 L1000,279" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="1000" y="234" text-anchor="middle" font-size="12" fill="#334155">完整声明</text><path d="M840,325 L766,325" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="803" y="317" text-anchor="middle" font-size="12" fill="#334155">计划</text><path d="M440,325 L366,325" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="403" y="317" text-anchor="middle" font-size="12" fill="#334155">原子发布</text><path d="M200,365 L200,439" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="200" y="394" text-anchor="middle" font-size="12" fill="#334155">直接消费</text><path d="M200,445 L600,211" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="400" y="320" text-anchor="middle" font-size="12" fill="#334155">开发指标</text><g><title>冻结问题、公式、样本与预算。</title><rect x="40" y="125" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="200" y="157" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">个人研究问题</text><text x="200" y="183" text-anchor="middle" font-size="13" fill="#475569">1 · human</text></g><g><title>RD-Agent 读取成功 Result 的开发指标，最终留出不进入循环。</title><rect x="440" y="125" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="600" y="157" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">可选 AI 提案</text><text x="600" y="183" text-anchor="middle" font-size="13" fill="#475569">2 · ai</text></g><g><title>保存来源、日期、算法、指标、时点与资源声明。</title><rect x="840" y="125" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="1000" y="157" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">ResearchPackage</text><text x="1000" y="183" text-anchor="middle" font-size="13" fill="#475569">3 · package</text></g><g><title>同次解析和编译对象直接交接；检查实际来源与 PIT。</title><rect x="840" y="285" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="1000" y="317" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">一次准备与准入</text><text x="1000" y="343" text-anchor="middle" font-size="13" fill="#475569">4 · admit</text></g><g><title>模型由 Qlib 执行，分钟策略由 LEAN 执行。</title><rect x="440" y="285" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="600" y="317" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">计算或回测</text><text x="600" y="343" text-anchor="middle" font-size="13" fill="#475569">5 · run</text></g><g><title>发布正式表、指标、摘要和持久来源引用。</title><rect x="40" y="285" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="200" y="317" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Result</text><text x="200" y="343" text-anchor="middle" font-size="13" fill="#475569">6 · result</text></g><g><title>直接读取 Result 生成报告、比较或下一轮开发反馈。</title><rect x="40" y="445" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="200" y="477" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">报告与反馈</text><text x="200" y="503" text-anchor="middle" font-size="13" fill="#475569">7 · report</text></g></svg>
