<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="调用时序" font-family="Microsoft YaHei, 微软雅黑" font-weight="400"><title>调用时序</title><desc>同次对象交接与跨进程持久计划分别处理。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#f1f5f9"/><text x="40" y="45" font-size="28" font-weight="700" fill="#0f172a">调用时序</text><text x="40" y="80" font-size="15" fill="#475569">同次对象交接与跨进程持久计划分别处理。</text><path d="M360,165 L434,165" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="397" y="157" text-anchor="middle" font-size="12" fill="#334155">准备</text><path d="M760,165 L834,165" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="797" y="157" text-anchor="middle" font-size="12" fill="#334155">同一对象</text><path d="M1000,205 L1000,279" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="1000" y="234" text-anchor="middle" font-size="12" fill="#334155">持久计划</text><path d="M840,325 L766,325" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="803" y="317" text-anchor="middle" font-size="12" fill="#334155">typed输出</text><path d="M440,325 L366,325" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="403" y="317" text-anchor="middle" font-size="12" fill="#334155">Result位置</text><path d="M200,365 L200,439" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="200" y="394" text-anchor="middle" font-size="12" fill="#334155">ResultContext</text><g><title>分配或接续原 execution。</title><rect x="40" y="125" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="200" y="157" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">execute_workspace</text><text x="200" y="183" text-anchor="middle" font-size="13" fill="#475569">1 · execute</text></g><g><title>解析和编译一次，交接已准备对象。</title><rect x="440" y="125" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="600" y="157" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">prepare_package</text><text x="600" y="183" text-anchor="middle" font-size="13" fill="#475569">2 · prepare</text></g><g><title>检查实际来源、结构和可见性，发布计划。</title><rect x="840" y="125" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="1000" y="157" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">admit_package</text><text x="1000" y="183" text-anchor="middle" font-size="13" fill="#475569">3 · admit</text></g><g><title>调度有界 Worker，消费合格输入并保存 checkpoint。</title><rect x="840" y="285" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="1000" y="317" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">RuntimeExecutionService</text><text x="1000" y="343" text-anchor="middle" font-size="13" fill="#475569">4 · runtime</text></g><g><title>节点成功后发布 Result；组装失败可恢复。</title><rect x="440" y="285" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="600" y="317" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">ResultAssembler</text><text x="600" y="343" text-anchor="middle" font-size="13" fill="#475569">5 · assemble</text></g><g><title>加载正式输出、指标、结论范围和限制。</title><rect x="40" y="285" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="200" y="317" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">load_result_context</text><text x="200" y="343" text-anchor="middle" font-size="13" fill="#475569">6 · context</text></g><g><title>按需读取正式表，直接交付研究结果。</title><rect x="40" y="445" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="200" y="477" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">report / compare / export</text><text x="200" y="503" text-anchor="middle" font-size="13" fill="#475569">7 · report</text></g></svg>
