<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 740" role="img" aria-label="一次运行中，谁先调用谁"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><style>text{font-family:"Microsoft YaHei","微软雅黑",sans-serif;font-style:normal}.node{cursor:pointer}.node:focus{outline:none}.node:focus-visible>rect:first-of-type{stroke-dasharray:4 3}.dim{opacity:.17}.highlight>rect:first-of-type{stroke-width:4}.edge{transition:opacity .15s}</style><rect width="1120" height="740" rx="20" fill="#f8fafc"/><line x1="140" x2="140" y1="120" y2="715" stroke="#cbd5e1" stroke-dasharray="5 6"/><line x1="415" x2="415" y1="120" y2="715" stroke="#cbd5e1" stroke-dasharray="5 6"/><line x1="690" x2="690" y1="120" y2="715" stroke="#cbd5e1" stroke-dasharray="5 6"/><line x1="965" x2="965" y1="120" y2="715" stroke="#cbd5e1" stroke-dasharray="5 6"/><g class="edge" data-from="cli" data-to="runtime"><path d="M140,175 L415,175" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="228.5" y="153" width="98" height="19" rx="5" fill="#f8fafc"/><text x="277.5" y="167" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">执行已准入计划</text></g><g class="edge" data-from="runtime" data-to="adapter"><path d="M415,225 L690,225" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="485.5" y="203" width="134" height="19" rx="5" fill="#f8fafc"/><text x="552.5" y="217" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">调度数据节点与上下文</text></g><g class="edge" data-from="adapter" data-to="runtime"><path d="M690,275 L415,275" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="479.5" y="253" width="146" height="19" rx="5" fill="#f8fafc"/><text x="552.5" y="267" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">取数后返回列式工件引用</text></g><g class="edge" data-from="runtime" data-to="runtime"><path d="M415,313 L480,313 L480,337 L415,337" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="475" y="314" width="230" height="19" rx="5" fill="#f8fafc"/><text x="590" y="328" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">核验输出并提交 checkpoint</text></g><g class="edge" data-from="runtime" data-to="adapter"><path d="M415,375 L690,375" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="473.5" y="353" width="158" height="19" rx="5" fill="#f8fafc"/><text x="552.5" y="367" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">调度因子、模型或仿真节点</text></g><g class="edge" data-from="adapter" data-to="runtime"><path d="M690,425 L415,425" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="509.5" y="403" width="86" height="19" rx="5" fill="#f8fafc"/><text x="552.5" y="417" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">返回计算产出</text></g><g class="edge" data-from="runtime" data-to="cli"><path d="M415,475 L140,475" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="192.5" y="453" width="170" height="19" rx="5" fill="#f8fafc"/><text x="277.5" y="467" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">全部节点完成，返回运行摘要</text></g><g class="edge" data-from="cli" data-to="store"><path d="M140,525 L965,525" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="401.5" y="503" width="302" height="19" rx="5" fill="#f8fafc"/><text x="552.5" y="517" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">封存 Result，记录 finalize 状态</text></g><g class="edge" data-from="store" data-to="cli"><path d="M965,575 L140,575" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="509.5" y="553" width="86" height="19" rx="5" fill="#f8fafc"/><text x="552.5" y="567" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">返回结果位置</text></g><g class="edge" data-from="cli" data-to="store"><path d="M140,625 L965,625" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="479.5" y="603" width="146" height="19" rx="5" fill="#f8fafc"/><text x="552.5" y="617" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">另行执行 verify</text></g><g class="edge" data-from="store" data-to="cli"><path d="M965,675 L140,675" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="419.5" y="653" width="266" height="19" rx="5" fill="#f8fafc"/><text x="552.5" y="667" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">返回 VerificationResult</text></g><g class="node" data-id="cli" tabindex="0" role="button" aria-pressed="false" aria-label="命令入口"><title>负责运行编排与最终封存。</title><rect x="20" y="30" width="240" height="90" rx="12" fill="white" stroke="#2563eb" stroke-width="1.5"/><rect x="20" y="45" width="4" height="60" rx="2" fill="#2563eb"/><text x="38" y="65" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">命令入口</text><text x="38" y="92" font-size="13" fill="#475569" font-weight="400" text-anchor="start">run / verify</text><circle cx="246" cy="44" r="3" fill="#2563eb"/></g><g class="node" data-id="runtime" tabindex="0" role="button" aria-pressed="false" aria-label="运行主控"><title>调度算法步骤，验证并提交检查点。</title><rect x="295" y="30" width="240" height="90" rx="12" fill="white" stroke="#2563eb" stroke-width="1.5"/><rect x="295" y="45" width="4" height="60" rx="2" fill="#2563eb"/><text x="313" y="65" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">运行主控</text><text x="313" y="92" font-size="13" fill="#475569" font-weight="400" text-anchor="start">Runtime</text><circle cx="521" cy="44" r="3" fill="#2563eb"/></g><g class="node" data-id="adapter" tabindex="0" role="button" aria-pressed="false" aria-label="节点适配器"><title>数据节点调用数据平面，算法节点消费正式输入。</title><rect x="570" y="30" width="240" height="90" rx="12" fill="white" stroke="#2563eb" stroke-width="1.5"/><rect x="570" y="45" width="4" height="60" rx="2" fill="#2563eb"/><text x="588" y="65" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">节点适配器</text><text x="588" y="92" font-size="13" fill="#475569" font-weight="400" text-anchor="start">计算 / 数据平面</text><circle cx="796" cy="44" r="3" fill="#2563eb"/></g><g class="node" data-id="store" tabindex="0" role="button" aria-pressed="false" aria-label="结果与独立检查"><title>Result 封存后，再执行独立检查。</title><rect x="845" y="30" width="240" height="90" rx="12" fill="white" stroke="#2563eb" stroke-width="1.5"/><rect x="845" y="45" width="4" height="60" rx="2" fill="#2563eb"/><text x="863" y="65" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">结果与独立检查</text><text x="863" y="92" font-size="13" fill="#475569" font-weight="400" text-anchor="start">Result / Verifier</text><circle cx="1071" cy="44" r="3" fill="#2563eb"/></g></svg>
