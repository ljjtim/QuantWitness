<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="运行状态" font-family="Microsoft YaHei, 微软雅黑" font-weight="400"><title>运行状态</title><desc>节点、运行和结果组装各自保留真实状态。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#f1f5f9"/><text x="40" y="45" font-size="28" font-weight="700" fill="#0f172a">运行状态</text><text x="40" y="80" font-size="15" fill="#475569">节点、运行和结果组装各自保留真实状态。</text><path d="M360,165 L434,165" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="397" y="157" text-anchor="middle" font-size="12" fill="#334155">启动</text><path d="M760,165 L834,165" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="797" y="157" text-anchor="middle" font-size="12" fill="#334155">提交成功</text><path d="M600,205 L1000,279" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="800" y="234" text-anchor="middle" font-size="12" fill="#334155">失败</text><path d="M1000,285 L600,211" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="800" y="240" text-anchor="middle" font-size="12" fill="#334155">合法恢复</text><path d="M1000,205 L600,279" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="800" y="234" text-anchor="middle" font-size="12" fill="#334155">全部完成</text><path d="M440,325 L366,325" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="403" y="317" text-anchor="middle" font-size="12" fill="#334155">原子发布</text><path d="M200,365 L200,439" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="200" y="394" text-anchor="middle" font-size="12" fill="#334155">直接读取</text><g><title>固定输入、实现、参数与预算。</title><rect x="40" y="125" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="200" y="157" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">已准入计划</text><text x="200" y="183" text-anchor="middle" font-size="13" fill="#475569">1 · plan</text></g><g><title>queued/running与心跳不代表输出成功。</title><rect x="440" y="125" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="600" y="157" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">节点执行</text><text x="600" y="183" text-anchor="middle" font-size="13" fill="#475569">2 · running</text></g><g><title>内容、资源与交接合格后才能复用。</title><rect x="840" y="125" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="1000" y="157" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">成功 checkpoint</text><text x="1000" y="183" text-anchor="middle" font-size="13" fill="#475569">3 · checkpoint</text></g><g><title>同身份resume或允许的retry；更改声明后重新准入。</title><rect x="840" y="285" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="1000" y="317" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">中断或节点失败</text><text x="1000" y="343" text-anchor="middle" font-size="13" fill="#475569">4 · failure</text></g><g><title>全部节点成功但组装失败时只重试组装。</title><rect x="440" y="285" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="600" y="317" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Result组装</text><text x="600" y="343" text-anchor="middle" font-size="13" fill="#475569">5 · finalize</text></g><g><title>结果只读，补齐completion与索引不重跑节点。</title><rect x="40" y="285" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="200" y="317" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Result已发布</text><text x="200" y="343" text-anchor="middle" font-size="13" fill="#475569">6 · published</text></g><g><title>结果消费失败后只重试交付，不重复训练或holdout。</title><rect x="40" y="445" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="200" y="477" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">报告或导出</text><text x="200" y="503" text-anchor="middle" font-size="13" fill="#475569">7 · delivery</text></g></svg>
