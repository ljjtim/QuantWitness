<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 695" role="img" aria-label="程序跑完，不代表研究已验证"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><style>text{font-family:"Microsoft YaHei","微软雅黑",sans-serif;font-style:normal}.node{cursor:pointer}.node:focus{outline:none}.node:focus-visible>rect:first-of-type{stroke-dasharray:4 3}.dim{opacity:.17}.highlight>rect:first-of-type{stroke-width:4}.edge{transition:opacity .15s}</style><rect width="1120" height="695" rx="20" fill="#f8fafc"/><g class="edge" data-from="created" data-to="planned"><path d="M275,105 L415,105" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/></g><g class="edge" data-from="planned" data-to="running"><path d="M655,105 L795,105" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/></g><g class="edge" data-from="running" data-to="paused"><path d="M915,150 L915,280" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="878" y="193" width="74" height="19" rx="5" fill="#f8fafc"/><text x="915" y="207" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">可重试失败</text></g><g class="edge" data-from="running" data-to="failed"><path d="M915,150 L915,215 L535,215 L535,280" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="713" y="188" width="74" height="19" rx="5" fill="#f8fafc"/><text x="750" y="202" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">终止性错误</text></g><g class="edge" data-from="running" data-to="success"><path d="M1035,105 L1080,105 L1080,460 L320,460 L320,325 L275,325" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="637" y="437" width="86" height="19" rx="5" fill="#f8fafc"/><text x="680" y="451" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">全部节点成功</text></g><g class="edge" data-from="paused" data-to="running"><path d="M1035,325 L1058,325 L1058,180 L1030,150" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="932" y="239" width="242" height="19" rx="5" fill="#f8fafc"/><text x="1053" y="253" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">resume / retry-node</text></g><g class="edge" data-from="success" data-to="finalize"><path d="M155,370 L155,515" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="136" y="420.5" width="38" height="19" rx="5" fill="#f8fafc"/><text x="155" y="434.5" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">封存</text></g><g class="edge" data-from="finalize" data-to="verify"><path d="M275,560 L415,560" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="320" y="538" width="50" height="19" rx="5" fill="#f8fafc"/><text x="345" y="552" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">成功后</text></g><g class="edge" data-from="verify" data-to="delivery"><path d="M655,560 L795,560" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="688" y="538" width="74" height="19" rx="5" fill="#f8fafc"/><text x="725" y="552" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">结论与报告</text></g><g class="node" data-id="created" tabindex="0" role="button" aria-pressed="false" aria-label="created"><title>Runtime 已建立运行记录。</title><rect x="35" y="60" width="240" height="90" rx="12" fill="white" stroke="#2563eb" stroke-width="1.5"/><rect x="35" y="75" width="4" height="60" rx="2" fill="#2563eb"/><text x="53" y="95" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">created</text><text x="53" y="122" font-size="13" fill="#475569" font-weight="400" text-anchor="start">已建立运行</text><circle cx="261" cy="74" r="3" fill="#2563eb"/></g><g class="node" data-id="planned" tabindex="0" role="button" aria-pressed="false" aria-label="planned"><title>执行前的计划状态。</title><rect x="415" y="60" width="240" height="90" rx="12" fill="white" stroke="#2563eb" stroke-width="1.5"/><rect x="415" y="75" width="4" height="60" rx="2" fill="#2563eb"/><text x="433" y="95" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">planned</text><text x="433" y="122" font-size="13" fill="#475569" font-weight="400" text-anchor="start">计划就绪</text><circle cx="641" cy="74" r="3" fill="#2563eb"/></g><g class="node" data-id="running" tabindex="0" role="button" aria-pressed="false" aria-label="running"><title>进程意外终止时可能保留本状态，随后用 resume 恢复。</title><rect x="795" y="60" width="240" height="90" rx="12" fill="white" stroke="#2563eb" stroke-width="1.5"/><rect x="795" y="75" width="4" height="60" rx="2" fill="#2563eb"/><text x="813" y="95" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">running</text><text x="813" y="122" font-size="13" fill="#475569" font-weight="400" text-anchor="start">节点执行中</text><circle cx="1021" cy="74" r="3" fill="#2563eb"/></g><g class="node" data-id="paused" tabindex="0" role="button" aria-pressed="false" aria-label="paused"><title>按 inspect 建议使用 retry-node；该命令先将运行恢复为 running。</title><rect x="795" y="280" width="240" height="90" rx="12" fill="white" stroke="#b45309" stroke-width="1.5"/><rect x="795" y="295" width="4" height="60" rx="2" fill="#b45309"/><text x="813" y="315" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">paused</text><text x="813" y="342" font-size="13" fill="#475569" font-weight="400" text-anchor="start">可重试节点失败，等待处理</text><circle cx="1021" cy="294" r="3" fill="#b45309"/></g><g class="node" data-id="failed" tabindex="0" role="button" aria-pressed="false" aria-label="failed"><title>需要查阅诊断。不能把失败步骤输出当正式结果。</title><rect x="415" y="280" width="240" height="90" rx="12" fill="white" stroke="#be123c" stroke-width="1.5"/><rect x="415" y="295" width="4" height="60" rx="2" fill="#be123c"/><text x="433" y="315" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">failed</text><text x="433" y="342" font-size="13" fill="#475569" font-weight="400" text-anchor="start">不可重试 / 次数已耗尽</text><circle cx="641" cy="294" r="3" fill="#be123c"/></g><g class="node" data-id="success" tabindex="0" role="button" aria-pressed="false" aria-label="succeeded"><title>仅指 Runtime 成功，不代表 Result 已封存或独立验证通过。</title><rect x="35" y="280" width="240" height="90" rx="12" fill="white" stroke="#15803d" stroke-width="1.5"/><rect x="35" y="295" width="4" height="60" rx="2" fill="#15803d"/><text x="53" y="315" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">succeeded</text><text x="53" y="342" font-size="13" fill="#475569" font-weight="400" text-anchor="start">全部节点成功</text><circle cx="261" cy="294" r="3" fill="#15803d"/></g><g class="node" data-id="finalize" tabindex="0" role="button" aria-pressed="false" aria-label="Result 封存"><title>CLI 单独记录封存状态，成功后才有正式结果交付。</title><rect x="35" y="515" width="240" height="90" rx="12" fill="white" stroke="#087f8c" stroke-width="1.5"/><rect x="35" y="530" width="4" height="60" rx="2" fill="#087f8c"/><text x="53" y="550" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">Result 封存</text><text x="53" y="577" font-size="13" fill="#475569" font-weight="400" text-anchor="start">pending → succeeded / failed</text><circle cx="261" cy="529" r="3" fill="#087f8c"/></g><g class="node" data-id="verify" tabindex="0" role="button" aria-pressed="false" aria-label="独立验证"><title>VerificationResult 是独立文件；判断验证结果，而不是仅检查进程退出。</title><rect x="415" y="515" width="240" height="90" rx="12" fill="white" stroke="#15803d" stroke-width="1.5"/><rect x="415" y="530" width="4" height="60" rx="2" fill="#15803d"/><text x="433" y="550" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">独立验证</text><text x="433" y="577" font-size="13" fill="#475569" font-weight="400" text-anchor="start">生成检查结论与发现</text><circle cx="641" cy="529" r="3" fill="#15803d"/></g><g class="node" data-id="delivery" tabindex="0" role="button" aria-pressed="false" aria-label="可阅读、可复核的交付"><title>保留检查范围。失败报告可用于诊断，不能用于有效开发选优。</title><rect x="795" y="515" width="240" height="90" rx="12" fill="white" stroke="#b45309" stroke-width="1.5"/><rect x="795" y="530" width="4" height="60" rx="2" fill="#b45309"/><text x="813" y="550" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">可阅读、可复核的交付</text><text x="813" y="577" font-size="13" fill="#475569" font-weight="400" text-anchor="start">Result + 检查单 + 报告</text><circle cx="1021" cy="529" r="3" fill="#b45309"/></g></svg>
