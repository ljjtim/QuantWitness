<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 685" role="img" aria-label="完成一次研究，要经过什么"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><style>text{font-family:"Microsoft YaHei","微软雅黑",sans-serif;font-style:normal}.node{cursor:pointer}.node:focus{outline:none}.node:focus-visible>rect:first-of-type{stroke-dasharray:4 3}.dim{opacity:.17}.highlight>rect:first-of-type{stroke-width:4}.edge{transition:opacity .15s}</style><rect width="1120" height="685" rx="20" fill="#f8fafc"/><g class="edge" data-from="spec" data-to="lint"><path d="M300,100 L440,100" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="339" y="78" width="62" height="19" rx="5" fill="#f8fafc"/><text x="370" y="92" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">完整约定</text></g><g class="edge" data-from="lint" data-to="admit"><path d="M680,100 L820,100" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="719" y="78" width="62" height="19" rx="5" fill="#f8fafc"/><text x="750" y="92" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">检查通过</text></g><g class="edge" data-from="admit" data-to="run"><path d="M940,145 L940,285" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="903" y="193" width="74" height="19" rx="5" fill="#f8fafc"/><text x="940" y="207" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">已准入计划</text></g><g class="edge" data-from="run" data-to="result"><path d="M820,330 L680,330" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="719" y="308" width="62" height="19" rx="5" fill="#f8fafc"/><text x="750" y="322" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">节点完成</text></g><g class="edge" data-from="result" data-to="verify"><path d="M440,330 L300,330" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="333" y="308" width="74" height="19" rx="5" fill="#f8fafc"/><text x="370" y="322" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">已封存结果</text></g><g class="edge" data-from="verify" data-to="report"><path d="M180,375 L180,515" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="149" y="423" width="62" height="19" rx="5" fill="#f8fafc"/><text x="180" y="437" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">检查结论</text></g><g class="edge" data-from="run" data-to="recover"><path d="M940,375 L940,515" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="891" y="423" width="98" height="19" rx="5" fill="#f8fafc"/><text x="940" y="437" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">异常 / 中断</text></g><g class="edge" data-from="recover" data-to="run"><path d="M1060,560 L1090,560 L1090,330 L1060,330" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="1053" y="432" width="74" height="19" rx="5" fill="#f8fafc"/><text x="1090" y="446" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">按诊断恢复</text></g><g class="node" data-id="spec" tabindex="0" role="button" aria-pressed="false" aria-label="① 写清研究问题"><title>可由人填写或由 AI 辅助起草；用 ResearchPackage 保存。</title><rect x="60" y="55" width="240" height="90" rx="12" fill="white" stroke="#b45309" stroke-width="1.5"/><rect x="60" y="70" width="4" height="60" rx="2" fill="#b45309"/><text x="78" y="90" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">① 写清研究问题</text><text x="78" y="117" font-size="13" fill="#475569" font-weight="400" text-anchor="start">数据范围 · 公式 · 评价办法</text><circle cx="286" cy="69" r="3" fill="#b45309"/></g><g class="node" data-id="lint" tabindex="0" role="button" aria-pressed="false" aria-label="② 检查声明"><title>检查必填项、算法步骤、输出要求和缺口。检查通过不等于获得数据准入。</title><rect x="440" y="55" width="240" height="90" rx="12" fill="white" stroke="#15803d" stroke-width="1.5"/><rect x="440" y="70" width="4" height="60" rx="2" fill="#15803d"/><text x="458" y="90" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">② 检查声明</text><text x="458" y="117" font-size="13" fill="#475569" font-weight="400" text-anchor="start">package lint</text><circle cx="666" cy="69" r="3" fill="#15803d"/></g><g class="node" data-id="admit" tabindex="0" role="button" aria-pressed="false" aria-label="③ 检查数据与时点"><title>绑定已批准的数据说明、来源和 PIT 约定，发布不可变计划。</title><rect x="820" y="55" width="240" height="90" rx="12" fill="white" stroke="#15803d" stroke-width="1.5"/><rect x="820" y="70" width="4" height="60" rx="2" fill="#15803d"/><text x="838" y="90" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">③ 检查数据与时点</text><text x="838" y="117" font-size="13" fill="#475569" font-weight="400" text-anchor="start">package admit</text><circle cx="1046" cy="69" r="3" fill="#15803d"/></g><g class="node" data-id="run" tabindex="0" role="button" aria-pressed="false" aria-label="④ 执行并保存进度"><title>Runtime 调度节点、控制资源、记录事件并提交检查点。</title><rect x="820" y="285" width="240" height="90" rx="12" fill="white" stroke="#2563eb" stroke-width="1.5"/><rect x="820" y="300" width="4" height="60" rx="2" fill="#2563eb"/><text x="838" y="320" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">④ 执行并保存进度</text><text x="838" y="347" font-size="13" fill="#475569" font-weight="400" text-anchor="start">run</text><circle cx="1046" cy="299" r="3" fill="#2563eb"/></g><g class="node" data-id="result" tabindex="0" role="button" aria-pressed="false" aria-label="⑤ 封存研究结果"><title>节点全部成功后，CLI 独立封存结果；封存失败不能报作研究交付完成。</title><rect x="440" y="285" width="240" height="90" rx="12" fill="white" stroke="#087f8c" stroke-width="1.5"/><rect x="440" y="300" width="4" height="60" rx="2" fill="#087f8c"/><text x="458" y="320" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">⑤ 封存研究结果</text><text x="458" y="347" font-size="13" fill="#475569" font-weight="400" text-anchor="start">CLI finalize → Result</text><circle cx="666" cy="299" r="3" fill="#087f8c"/></g><g class="node" data-id="verify" tabindex="0" role="button" aria-pressed="false" aria-label="⑥ 独立复核"><title>按声明的公式、金融和统计约定进行独立检查。</title><rect x="60" y="285" width="240" height="90" rx="12" fill="white" stroke="#15803d" stroke-width="1.5"/><rect x="60" y="300" width="4" height="60" rx="2" fill="#15803d"/><text x="78" y="320" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">⑥ 独立复核</text><text x="78" y="347" font-size="13" fill="#475569" font-weight="400" text-anchor="start">verify → VerificationResult</text><circle cx="286" cy="299" r="3" fill="#15803d"/></g><g class="node" data-id="report" tabindex="0" role="button" aria-pressed="false" aria-label="⑦ 阅读与比较"><title>验证失败也可有诊断报告，但不能作为有效开发指标反馈给 AI。</title><rect x="60" y="515" width="240" height="90" rx="12" fill="white" stroke="#b45309" stroke-width="1.5"/><rect x="60" y="530" width="4" height="60" rx="2" fill="#b45309"/><text x="78" y="550" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">⑦ 阅读与比较</text><text x="78" y="577" font-size="13" fill="#475569" font-weight="400" text-anchor="start">report / compare</text><circle cx="286" cy="529" r="3" fill="#b45309"/></g><g class="node" data-id="recover" tabindex="0" role="button" aria-pressed="false" aria-label="中断或可重试失败"><title>进程中断用 resume；paused 状态按诊断对指定节点 retry-node。不可恢复错误先修正问题并重新准入。</title><rect x="820" y="515" width="240" height="90" rx="12" fill="white" stroke="#2563eb" stroke-width="1.5"/><rect x="820" y="530" width="4" height="60" rx="2" fill="#2563eb"/><text x="838" y="550" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">中断或可重试失败</text><text x="838" y="577" font-size="13" fill="#475569" font-weight="400" text-anchor="start">inspect → resume / retry-node</text><circle cx="1046" cy="529" r="3" fill="#2563eb"/></g></svg>
