<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="研究流程" font-family="Microsoft YaHei, 微软雅黑" font-weight="400"><title>研究流程</title><desc>独立 lint 是主动诊断；普通 execute 不重复完整准备。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#f1f5f9"/><text x="40" y="45" font-size="28" font-weight="700" fill="#0f172a">研究流程</text><text x="40" y="80" font-size="15" fill="#475569">独立 lint 是主动诊断；普通 execute 不重复完整准备。</text><path d="M360,165 L434,165" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="397" y="157" text-anchor="middle" font-size="12" fill="#334155">声明</text><path d="M760,165 L834,165" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="797" y="157" text-anchor="middle" font-size="12" fill="#334155">execute</text><path d="M1000,205 L1000,279" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="1000" y="234" text-anchor="middle" font-size="12" fill="#334155">计划</text><path d="M840,325 L766,325" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="803" y="317" text-anchor="middle" font-size="12" fill="#334155">成功输出</text><path d="M440,325 L366,325" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="403" y="317" text-anchor="middle" font-size="12" fill="#334155">直接消费</text><path d="M200,365 L200,439" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="200" y="394" text-anchor="middle" font-size="12" fill="#334155">选定候选</text><g><title>确认公式和研究边界。</title><rect x="40" y="125" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="200" y="157" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">研究问题与约定</text><text x="200" y="183" text-anchor="middle" font-size="13" fill="#475569">1 · question</text></g><g><title>填写四份声明与输入；lint可主动诊断缺项。</title><rect x="440" y="125" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="600" y="157" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">完整研究包</text><text x="600" y="183" text-anchor="middle" font-size="13" fill="#475569">2 · draft</text></g><g><title>一次解析、编译、检查并交接对象。</title><rect x="840" y="125" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="1000" y="157" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">准备与准入</text><text x="1000" y="183" text-anchor="middle" font-size="13" fill="#475569">3 · prepare</text></g><g><title>发布合格 checkpoint，记录资源与真实进展。</title><rect x="840" y="285" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="1000" y="317" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">执行 DAG</text><text x="1000" y="343" text-anchor="middle" font-size="13" fill="#475569">4 · run</text></g><g><title>封存正式表、模型和必要来源引用。</title><rect x="440" y="285" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="600" y="317" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">发布 Result</text><text x="600" y="343" text-anchor="middle" font-size="13" fill="#475569">5 · result</text></g><g><title>直接 Result 交付；报告失败不重跑金融。</title><rect x="40" y="285" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="200" y="317" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">报告与开发反馈</text><text x="200" y="343" text-anchor="middle" font-size="13" fill="#475569">6 · report</text></g><g><title>单独确认候选后消费持久留出，打开后失败不返还。</title><rect x="40" y="445" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="200" y="477" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">最终评价</text><text x="200" y="503" text-anchor="middle" font-size="13" fill="#475569">7 · holdout</text></g></svg>
