<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="模块职责" font-family="Microsoft YaHei, 微软雅黑" font-weight="400"><title>模块职责</title><desc>箭头表示主要交接，模块内部依赖以源码为准。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#f1f5f9"/><text x="40" y="45" font-size="28" font-weight="700" fill="#0f172a">模块职责</text><text x="40" y="80" font-size="15" fill="#475569">箭头表示主要交接，模块内部依赖以源码为准。</text><path d="M360,165 L434,165" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="397" y="157" text-anchor="middle" font-size="12" fill="#334155">准备</text><path d="M760,165 L834,165" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="797" y="157" text-anchor="middle" font-size="12" fill="#334155">来源准入</text><path d="M1000,205 L1000,279" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="1000" y="234" text-anchor="middle" font-size="12" fill="#334155">绑定</text><path d="M600,205 L600,279" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="600" y="234" text-anchor="middle" font-size="12" fill="#334155">执行图</text><path d="M840,325 L766,325" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="803" y="317" text-anchor="middle" font-size="12" fill="#334155">列式输入</text><path d="M440,325 L366,325" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="403" y="317" text-anchor="middle" font-size="12" fill="#334155">研究节点</text><path d="M600,365 L200,439" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="400" y="394" text-anchor="middle" font-size="12" fill="#334155">金融节点</text><path d="M200,365 L600,439" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="400" y="394" text-anchor="middle" font-size="12" fill="#334155">模型与指标</text><path d="M360,485 L434,485" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="397" y="477" text-anchor="middle" font-size="12" fill="#334155">交易事实</text><path d="M760,485 L834,485" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="797" y="477" text-anchor="middle" font-size="12" fill="#334155">直接交付</text><g><title>application 组织准备、准入、运行和恢复。</title><rect x="40" y="125" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="200" y="157" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">CLI / Workspace</text><text x="200" y="183" text-anchor="middle" font-size="13" fill="#475569">1 · cli</text></g><g><title>解析 ResearchPackage、编译 QueryIR、图和指标。</title><rect x="440" y="125" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="600" y="157" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">packages</text><text x="600" y="183" text-anchor="middle" font-size="13" fill="#475569">2 · packages</text></g><g><title>字段、物理来源、历史可见性和 Catalog Lock。</title><rect x="840" y="125" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="1000" y="157" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">catalog</text><text x="1000" y="183" text-anchor="middle" font-size="13" fill="#475569">3 · catalog</text></g><g><title>只读数据访问、归档输入和有界列式物化。</title><rect x="840" y="285" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="1000" y="317" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">data_plane</text><text x="1000" y="343" text-anchor="middle" font-size="13" fill="#475569">4 · data</text></g><g><title>执行依赖图、监管资源、提交 checkpoint。</title><rect x="440" y="285" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="600" y="317" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">runtime</text><text x="600" y="343" text-anchor="middle" font-size="13" fill="#475569">5 · runtime</text></g><g><title>特征、标签、统计、Qlib模型与留出账本。</title><rect x="40" y="285" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="200" y="317" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">research</text><text x="200" y="343" text-anchor="middle" font-size="13" fill="#475569">6 · research</text></g><g><title>实际交易转换处处理资金、持仓、费用、规则和公司行动；分钟项目使用 LEAN。</title><rect x="40" y="445" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="200" y="477" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">domain / simulation</text><text x="200" y="503" text-anchor="middle" font-size="13" fill="#475569">7 · finance</text></g><g><title>原子发布 Result，提供 ResultContext。</title><rect x="440" y="445" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="600" y="477" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">results</text><text x="600" y="503" text-anchor="middle" font-size="13" fill="#475569">8 · result</text></g><g><title>读取正式结果；evidence 提供分析与研究范围事实。</title><rect x="840" y="445" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="1000" y="477" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">报告 / AI / Dashboard</text><text x="1000" y="503" text-anchor="middle" font-size="13" fill="#475569">9 · delivery</text></g></svg>
