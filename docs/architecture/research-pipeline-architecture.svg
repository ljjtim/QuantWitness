<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1260" role="img" aria-label="总体架构：核心模块与外部组件"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><style>text{font-family:"Microsoft YaHei","微软雅黑",sans-serif;font-style:normal}.node{cursor:pointer}.node:focus{outline:none}.node:focus-visible>rect:first-of-type{stroke-dasharray:4 3}.dim{opacity:.17}.highlight>rect:first-of-type{stroke-width:4}.edge{transition:opacity .15s}</style><rect width="1500" height="1260" rx="20" fill="#f8fafc"/><g class="module-group"><rect x="8" y="18" width="1484" height="168" rx="16" fill="#f3f0ff" stroke="#dbe3ed"/><text x="24" y="42" font-size="14" fill="#475569" font-weight="700" text-anchor="start">外部输入与可选组件</text></g><g class="module-group"><rect x="8" y="290" width="1400" height="650" rx="16" fill="#eff6ff" stroke="#dbe3ed"/><text x="24" y="314" font-size="14" fill="#475569" font-weight="700" text-anchor="start">核心模块</text></g><g class="module-group"><rect x="390" y="1025" width="670" height="170" rx="16" fill="#ecfdf5" stroke="#dbe3ed"/><text x="406" y="1049" font-size="14" fill="#475569" font-weight="700" text-anchor="start">全链公共支持</text></g><g class="edge" data-from="data" data-to="catalog"><path d="M190,160 L190,320" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="141" y="218" width="98" height="19" rx="5" fill="#f8fafc"/><text x="190" y="232" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">结构与来源说明</text></g><g class="edge" data-from="human" data-to="cli"><path d="M545,160 L545,320" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="502" y="218" width="86" height="19" rx="5" fill="#f8fafc"/><text x="545" y="232" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">直接发起研究</text></g><g class="edge" data-from="rd" data-to="cli"><path d="M900,160 L900,235 L545,235 L545,320" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="659" y="207" width="62" height="19" rx="5" fill="#f8fafc"/><text x="690" y="221" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">提交候选</text></g><g class="edge" data-from="cli" data-to="packages"><path d="M680,365 L765,365" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="691.5" y="343" width="62" height="19" rx="5" fill="#f8fafc"/><text x="722.5" y="357" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">编译研究</text></g><g class="edge" data-from="extensions" data-to="packages"><path d="M1120,365 L1035,365" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="1046.5" y="343" width="62" height="19" rx="5" fill="#f8fafc"/><text x="1077.5" y="357" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">算子定义</text></g><g class="edge" data-from="catalog" data-to="data_plane"><path d="M190,410 L190,570" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="159" y="468" width="62" height="19" rx="5" fill="#f8fafc"/><text x="190" y="482" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">读取约定</text></g><g class="edge" data-from="data" data-to="data_plane"><path d="M55,115 L15,115 L15,615 L55,615" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="42" y="470" width="62" height="19" rx="5" fill="#f8fafc"/><text x="73" y="484" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">只读取数</text></g><g class="edge" data-from="packages" data-to="runtime"><path d="M900,410 L900,570" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="863" y="468" width="74" height="19" rx="5" fill="#f8fafc"/><text x="900" y="482" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">已准入计划</text></g><g class="edge" data-from="runtime" data-to="application"><path d="M765,615 L680,615" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="691.5" y="593" width="62" height="19" rx="5" fill="#f8fafc"/><text x="722.5" y="607" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">数据节点</text></g><g class="edge" data-from="application" data-to="data_plane"><path d="M410,615 L325,615" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="330.5" y="593" width="74" height="19" rx="5" fill="#f8fafc"/><text x="367.5" y="607" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">请求与工件</text></g><g class="edge" data-from="runtime" data-to="research"><path d="M1035,615 L1120,615" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="1046.5" y="593" width="62" height="19" rx="5" fill="#f8fafc"/><text x="1077.5" y="607" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">研究节点</text></g><g class="edge" data-from="research" data-to="qlib"><path d="M1390,615 L1430,615 L1430,115 L1390,115" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="1363" y="252" width="62" height="19" rx="5" fill="#f8fafc"/><text x="1394" y="266" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">调用组件</text></g><g class="edge" data-from="runtime" data-to="simulation"><path d="M865,660 L865,722 L545,722 L545,820" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="617" y="697" width="86" height="19" rx="5" fill="#f8fafc"/><text x="660" y="711" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">调度仿真节点</text></g><g class="edge" data-from="domain" data-to="simulation"><path d="M325,865 L410,865" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="336.5" y="843" width="62" height="19" rx="5" fill="#f8fafc"/><text x="367.5" y="857" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">金融约定</text></g><g class="edge" data-from="simulation" data-to="results"><path d="M680,865 L765,865" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="691.5" y="843" width="62" height="19" rx="5" fill="#f8fafc"/><text x="722.5" y="857" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">金融事实</text></g><g class="edge" data-from="research" data-to="results"><path d="M1255,660 L1255,755 L970,755 L970,820" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="1094" y="729" width="62" height="19" rx="5" fill="#f8fafc"/><text x="1125" y="743" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">研究产物</text></g><g class="edge" data-from="runtime" data-to="results"><path d="M925,660 L925,820" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="954" y="676" width="86" height="19" rx="5" fill="#f8fafc"/><text x="997" y="690" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">交命令层封存</text></g><g class="edge" data-from="results" data-to="evidence"><path d="M1035,865 L1120,865" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="1046.5" y="843" width="62" height="19" rx="5" fill="#f8fafc"/><text x="1077.5" y="857" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">只读复核</text></g><g class="edge" data-from="evidence" data-to="rd"><path d="M1390,865 L1470,865 L1470,205 L970,205 L970,160" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="1145" y="179" width="110" height="19" rx="5" fill="#f8fafc"/><text x="1200" y="193" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">验证后的开发反馈</text></g><g class="node" data-id="data" tabindex="0" role="button" aria-pressed="false" aria-label="你的数据源"><title>外部数据由使用者准备。数据库、分钟文件与已封存输入分别走适用入口；读取保持只读，来源与历史可见性必须有依据。</title><rect x="55" y="70" width="270" height="90" rx="12" fill="white" stroke="#087f8c" stroke-width="1.5"/><rect x="55" y="85" width="4" height="60" rx="2" fill="#087f8c"/><text x="73" y="105" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">你的数据源</text><text x="73" y="132" font-size="13" fill="#475569" font-weight="400" text-anchor="start">DuckDB / Parquet / 归档输入</text><circle cx="311" cy="84" r="3" fill="#087f8c"/></g><g class="node" data-id="human" tabindex="0" role="button" aria-pressed="false" aria-label="研究者"><title>人确定研究问题、样本范围、时间约定与预算，填写研究包。普通研究不需要启用 AI。</title><rect x="410" y="70" width="270" height="90" rx="12" fill="white" stroke="#b45309" stroke-width="1.5"/><rect x="410" y="85" width="4" height="60" rx="2" fill="#b45309"/><text x="428" y="105" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">研究者</text><text x="428" y="132" font-size="13" fill="#475569" font-weight="400" text-anchor="start">确认公式 · 样本 · 预算</text><circle cx="666" cy="84" r="3" fill="#b45309"/></g><g class="node" data-id="rd" tabindex="0" role="button" aria-pressed="false" aria-label="RD-Agent · 可选 AI"><title>位于核心之外，通过 Workspace 与研究包接口提交候选。公式复现先由人确认定义；探索只接收通过验证的开发指标，不接收最终 test/holdout 答案。</title><rect x="765" y="70" width="270" height="90" rx="12" fill="white" stroke="#7c3aed" stroke-width="1.5"/><rect x="765" y="85" width="4" height="60" rx="2" fill="#7c3aed"/><text x="783" y="105" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">RD-Agent · 可选 AI</text><text x="783" y="132" font-size="13" fill="#475569" font-weight="400" text-anchor="start">提案 · 代码生成 · 反思</text><circle cx="1021" cy="84" r="3" fill="#7c3aed"/></g><g class="node" data-id="qlib" tabindex="0" role="button" aria-pressed="false" aria-label="Qlib · 可选算法组件"><title>通过研究模型适配层及项目扩展调用。提供模型与处理器，以及项目侧表达式、风险模型和组合组件，不负责本框架的结果封存与独立验证。</title><rect x="1120" y="70" width="270" height="90" rx="12" fill="white" stroke="#7c3aed" stroke-width="1.5"/><rect x="1120" y="85" width="4" height="60" rx="2" fill="#7c3aed"/><text x="1138" y="105" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">Qlib · 可选算法组件</text><text x="1138" y="132" font-size="13" fill="#475569" font-weight="400" text-anchor="start">模型 · 处理器 · 表达式</text><circle cx="1376" cy="84" r="3" fill="#7c3aed"/></g><g class="node" data-id="catalog" tabindex="0" role="button" aria-pressed="false" aria-label="Catalog · 数据说明"><title>描述数据集、字段、单位、物理绑定、可见性和修订政策；经明确确认编译为 Catalog Lock。packages 与数据准入会读取这份约定。</title><rect x="55" y="320" width="270" height="90" rx="12" fill="white" stroke="#15803d" stroke-width="1.5"/><rect x="55" y="335" width="4" height="60" rx="2" fill="#15803d"/><text x="73" y="355" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">Catalog · 数据说明</text><text x="73" y="382" font-size="13" fill="#475569" font-weight="400" text-anchor="start">catalog/</text><circle cx="311" cy="334" r="3" fill="#15803d"/></g><g class="node" data-id="cli" tabindex="0" role="button" aria-pressed="false" aria-label="CLI 与 Workspace"><title>编排检查、准入、执行、封存、独立验证和报告。Runtime 完成后由命令层调用 ResultAssembler 封存，运行完成本身不等于验证通过。</title><rect x="410" y="320" width="270" height="90" rx="12" fill="white" stroke="#2563eb" stroke-width="1.5"/><rect x="410" y="335" width="4" height="60" rx="2" fill="#2563eb"/><text x="428" y="355" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">CLI 与 Workspace</text><text x="428" y="382" font-size="13" fill="#475569" font-weight="400" text-anchor="start">cli/ · workspace.py</text><circle cx="666" cy="334" r="3" fill="#2563eb"/></g><g class="node" data-id="packages" tabindex="0" role="button" aria-pressed="false" aria-label="研究包与计划"><title>把研究声明、数据请求、算子图与结果要求编译为计划；结合 Catalog 和准入检查固定本次研究约定。</title><rect x="765" y="320" width="270" height="90" rx="12" fill="white" stroke="#2563eb" stroke-width="1.5"/><rect x="765" y="335" width="4" height="60" rx="2" fill="#2563eb"/><text x="783" y="355" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">研究包与计划</text><text x="783" y="382" font-size="13" fill="#475569" font-weight="400" text-anchor="start">packages/</text><circle cx="1021" cy="334" r="3" fill="#2563eb"/></g><g class="node" data-id="extensions" tabindex="0" role="button" aria-pressed="false" aria-label="项目扩展接口"><title>装载明确声明的项目算子包和相关接口，绑定实现及依赖。项目算法经运行时适配器调用，不能绕过正式输入与结果要求。</title><rect x="1120" y="320" width="270" height="90" rx="12" fill="white" stroke="#2563eb" stroke-width="1.5"/><rect x="1120" y="335" width="4" height="60" rx="2" fill="#2563eb"/><text x="1138" y="355" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">项目扩展接口</text><text x="1138" y="382" font-size="13" fill="#475569" font-weight="400" text-anchor="start">extensions/</text><circle cx="1376" cy="334" r="3" fill="#2563eb"/></g><g class="node" data-id="data_plane" tabindex="0" role="button" aria-pressed="false" aria-label="数据平面"><title>核对来源和数据约定，按请求读取数据并形成列式工件。普通读取、分钟扫描、归档输入有各自入口；与 Catalog 共同约束可见性。</title><rect x="55" y="570" width="270" height="90" rx="12" fill="white" stroke="#087f8c" stroke-width="1.5"/><rect x="55" y="585" width="4" height="60" rx="2" fill="#087f8c"/><text x="73" y="605" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">数据平面</text><text x="73" y="632" font-size="13" fill="#475569" font-weight="400" text-anchor="start">data_plane/</text><circle cx="311" cy="584" r="3" fill="#087f8c"/></g><g class="node" data-id="application" tabindex="0" role="button" aria-pressed="false" aria-label="数据应用编排"><title>为普通网格化数据节点组织请求、读取和资源测量，通过数据平面获得正式输入工件。不是所有分钟或归档入口都经过同一函数。</title><rect x="410" y="570" width="270" height="90" rx="12" fill="white" stroke="#2563eb" stroke-width="1.5"/><rect x="410" y="585" width="4" height="60" rx="2" fill="#2563eb"/><text x="428" y="605" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">数据应用编排</text><text x="428" y="632" font-size="13" fill="#475569" font-weight="400" text-anchor="start">application/</text><circle cx="666" cy="584" r="3" fill="#2563eb"/></g><g class="node" data-id="runtime" tabindex="0" role="button" aria-pressed="false" aria-label="运行时与资源调度"><title>调度节点依赖、资源、进程和检查点，经适配器执行数据、研究与仿真节点。只复用完整提交且身份一致的产物。</title><rect x="765" y="570" width="270" height="90" rx="12" fill="white" stroke="#2563eb" stroke-width="1.5"/><rect x="765" y="585" width="4" height="60" rx="2" fill="#2563eb"/><text x="783" y="605" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">运行时与资源调度</text><text x="783" y="632" font-size="13" fill="#475569" font-weight="400" text-anchor="start">runtime/</text><circle cx="1021" cy="584" r="3" fill="#2563eb"/></g><g class="node" data-id="research" tabindex="0" role="button" aria-pressed="false" aria-label="因子、模型与统计"><title>消费正式输入，执行已支持的因子、标签、模型和统计步骤。模型训练与选择遵守开发/最终留出划分，Qlib 是可选算法后端。</title><rect x="1120" y="570" width="270" height="90" rx="12" fill="white" stroke="#2563eb" stroke-width="1.5"/><rect x="1120" y="585" width="4" height="60" rx="2" fill="#2563eb"/><text x="1138" y="605" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">因子、模型与统计</text><text x="1138" y="632" font-size="13" fill="#475569" font-weight="400" text-anchor="start">research/</text><circle cx="1376" cy="584" r="3" fill="#2563eb"/></g><g class="node" data-id="domain" tabindex="0" role="button" aria-pressed="false" aria-label="金融领域约定"><title>定义市场、订单、持仓、现金、信用、保证金和公司行动的数据类型与规则口径。账户和市场规则按实际资产、品种、日期及来源声明。</title><rect x="55" y="820" width="270" height="90" rx="12" fill="white" stroke="#15803d" stroke-width="1.5"/><rect x="55" y="835" width="4" height="60" rx="2" fill="#15803d"/><text x="73" y="855" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">金融领域约定</text><text x="73" y="882" font-size="13" fill="#475569" font-weight="400" text-anchor="start">domain/</text><circle cx="311" cy="834" r="3" fill="#15803d"/></g><g class="node" data-id="simulation" tabindex="0" role="button" aria-pressed="false" aria-label="原生回测与账户"><title>在声明范围内处理交易事件、撮合、费用和账户记账，产出正式金融事实。借鉴 RQAlpha 的职责划分，不调用其执行引擎。</title><rect x="410" y="820" width="270" height="90" rx="12" fill="white" stroke="#2563eb" stroke-width="1.5"/><rect x="410" y="835" width="4" height="60" rx="2" fill="#2563eb"/><text x="428" y="855" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">原生回测与账户</text><text x="428" y="882" font-size="13" fill="#475569" font-weight="400" text-anchor="start">simulation/</text><circle cx="666" cy="834" r="3" fill="#2563eb"/></g><g class="node" data-id="results" tabindex="0" role="button" aria-pressed="false" aria-label="结果封存与存储"><title>由 CLI 在 Runtime 返回后调用，封存输入、配置、实现信息和输出表为 Result。结果封存具有单独状态，不由节点成功自动代替。</title><rect x="765" y="820" width="270" height="90" rx="12" fill="white" stroke="#087f8c" stroke-width="1.5"/><rect x="765" y="835" width="4" height="60" rx="2" fill="#087f8c"/><text x="783" y="855" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">结果封存与存储</text><text x="783" y="882" font-size="13" fill="#475569" font-weight="400" text-anchor="start">results/</text><circle cx="1021" cy="834" r="3" fill="#087f8c"/></g><g class="node" data-id="evidence" tabindex="0" role="button" aria-pressed="false" aria-label="独立验证与证据"><title>读取封存结果及支持事实，按声明的验证范围重新检查公式、时间和金融关系，生成 VerificationResult。报告由命令层读取结果及检查单；开发反馈只使用验证通过的指标。</title><rect x="1120" y="820" width="270" height="90" rx="12" fill="white" stroke="#15803d" stroke-width="1.5"/><rect x="1120" y="835" width="4" height="60" rx="2" fill="#15803d"/><text x="1138" y="855" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">独立验证与证据</text><text x="1138" y="882" font-size="13" fill="#475569" font-weight="400" text-anchor="start">evidence/</text><circle cx="1376" cy="834" r="3" fill="#15803d"/></g><g class="node" data-id="operations" tabindex="0" role="button" aria-pressed="false" aria-label="诊断与运维"><title>提供能力查询、环境诊断、文档检查与维护入口，为正式主链提供操作支持，不承担项目策略算法。</title><rect x="410" y="1070" width="270" height="90" rx="12" fill="white" stroke="#2563eb" stroke-width="1.5"/><rect x="410" y="1085" width="4" height="60" rx="2" fill="#2563eb"/><text x="428" y="1105" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">诊断与运维</text><text x="428" y="1132" font-size="13" fill="#475569" font-weight="400" text-anchor="start">operations/</text><circle cx="666" cy="1084" r="3" fill="#2563eb"/></g><g class="node" data-id="platform" tabindex="0" role="button" aria-pressed="false" aria-label="基础类型与公共约定"><title>提供时间、单位、身份、原子目录及公共数据类型等底层机制，被上层模块复用。</title><rect x="765" y="1070" width="270" height="90" rx="12" fill="white" stroke="#2563eb" stroke-width="1.5"/><rect x="765" y="1085" width="4" height="60" rx="2" fill="#2563eb"/><text x="783" y="1105" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">基础类型与公共约定</text><text x="783" y="1132" font-size="13" fill="#475569" font-weight="400" text-anchor="start">platform/</text><circle cx="1021" cy="1084" r="3" fill="#2563eb"/></g></svg>
