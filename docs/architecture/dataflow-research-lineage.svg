<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="数据追溯" font-family="Microsoft YaHei, 微软雅黑" font-weight="400"><title>数据追溯</title><desc>来源、时点、算法和结果由正式对象关联。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#f1f5f9"/><text x="40" y="45" font-size="28" font-weight="700" fill="#0f172a">数据追溯</text><text x="40" y="80" font-size="15" fill="#475569">来源、时点、算法和结果由正式对象关联。</text><path d="M360,165 L434,165" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="397" y="157" text-anchor="middle" font-size="12" fill="#334155">物理来源</text><path d="M760,165 L834,165" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="797" y="157" text-anchor="middle" font-size="12" fill="#334155">批准绑定</text><path d="M1000,205 L1000,279" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="1000" y="234" text-anchor="middle" font-size="12" fill="#334155">请求范围</text><path d="M840,325 L766,325" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="803" y="317" text-anchor="middle" font-size="12" fill="#334155">当时可见数据</text><path d="M440,325 L366,325" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="403" y="317" text-anchor="middle" font-size="12" fill="#334155">正式输出</text><path d="M200,365 L200,439" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="200" y="394" text-anchor="middle" font-size="12" fill="#334155">按需投影</text><g><title>数据库只读；输入归档与数据库来源互斥。</title><rect x="40" y="125" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="200" y="157" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">原始来源</text><text x="200" y="183" text-anchor="middle" font-size="13" fill="#475569">1 · source</text></g><g><title>固定字段、物理绑定和可见性规则。</title><rect x="440" y="125" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="600" y="157" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Catalog Lock</text><text x="600" y="183" text-anchor="middle" font-size="13" fill="#475569">2 · catalog</text></g><g><title>冻结请求、日期、参数、clock、seed和实现引用。</title><rect x="840" y="125" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="1000" y="157" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">准入计划</text><text x="1000" y="183" text-anchor="middle" font-size="13" fill="#475569">3 · plan</text></g><g><title>保留必要历史版本，按预算有界读取。</title><rect x="840" y="285" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="1000" y="317" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">列式输入 / 工件</text><text x="1000" y="343" text-anchor="middle" font-size="13" fill="#475569">4 · artifact</text></g><g><title>实际消费处限制 PIT、标签、资金与历史规则。</title><rect x="440" y="285" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="600" y="317" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">算法 / 交易节点</text><text x="600" y="343" text-anchor="middle" font-size="13" fill="#475569">5 · compute</text></g><g><title>正式表、指标、模型及配置和持久输入引用。</title><rect x="40" y="285" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="200" y="317" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Result</text><text x="200" y="343" text-anchor="middle" font-size="13" fill="#475569">6 · result</text></g><g><title>ResultContext直接读取所需列；原始持久依赖随归档保留。</title><rect x="40" y="445" width="320" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="200" y="477" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">报告 / 分析 / 导出</text><text x="200" y="503" text-anchor="middle" font-size="13" fill="#475569">7 · delivery</text></g></svg>
