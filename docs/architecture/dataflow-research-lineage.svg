<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 730" role="img" aria-label="结果从哪里来，如何追溯"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><style>text{font-family:"Microsoft YaHei","微软雅黑",sans-serif;font-style:normal}.node{cursor:pointer}.node:focus{outline:none}.node:focus-visible>rect:first-of-type{stroke-dasharray:4 3}.dim{opacity:.17}.highlight>rect:first-of-type{stroke-width:4}.edge{transition:opacity .15s}</style><rect width="1120" height="730" rx="20" fill="#f8fafc"/><g class="edge" data-from="source" data-to="catalog"><path d="M300,100 L440,100" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="333" y="78" width="74" height="19" rx="5" fill="#f8fafc"/><text x="370" y="92" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">字段与修订</text></g><g class="edge" data-from="catalog" data-to="plan"><path d="M680,100 L820,100" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="731" y="78" width="38" height="19" rx="5" fill="#f8fafc"/><text x="750" y="92" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">准入</text></g><g class="edge" data-from="source" data-to="input"><path d="M180,145 L180,285" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="149" y="193" width="62" height="19" rx="5" fill="#f8fafc"/><text x="180" y="207" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">实际记录</text></g><g class="edge" data-from="plan" data-to="input"><path d="M940,145 L940,215 L180,215 L180,285" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="529" y="188" width="62" height="19" rx="5" fill="#f8fafc"/><text x="560" y="202" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">取数约定</text></g><g class="edge" data-from="input" data-to="compute"><path d="M300,330 L440,330" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="339" y="308" width="62" height="19" rx="5" fill="#f8fafc"/><text x="370" y="322" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">列式输入</text></g><g class="edge" data-from="compute" data-to="result"><path d="M680,330 L820,330" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="713" y="308" width="74" height="19" rx="5" fill="#f8fafc"/><text x="750" y="322" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">输出与来源</text></g><g class="edge" data-from="result" data-to="verify"><path d="M940,375 L940,515" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="921" y="423" width="38" height="19" rx="5" fill="#f8fafc"/><text x="940" y="437" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">只读</text></g><g class="edge" data-from="verify" data-to="vr"><path d="M820,560 L680,560" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="713" y="538" width="74" height="19" rx="5" fill="#f8fafc"/><text x="750" y="552" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">独立检查单</text></g><g class="edge" data-from="vr" data-to="report"><path d="M440,560 L300,560" fill="none" stroke="#64748b" stroke-width="2"  marker-end="url(#arrow)"/><rect x="339" y="538" width="62" height="19" rx="5" fill="#f8fafc"/><text x="370" y="552" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">验证状态</text></g><g class="edge" data-from="result" data-to="report"><path d="M1060,330 L1090,330 L1090,658 L180,658 L180,605" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="633" y="635" width="74" height="19" rx="5" fill="#f8fafc"/><text x="670" y="649" font-size="12" fill="#475569" font-weight="400" text-anchor="middle">数值与来源</text></g><g class="node" data-id="source" tabindex="0" role="button" aria-pressed="false" aria-label="原始研究数据"><title>只读使用。已提交快照不会自动变成历史版本完整的数据。</title><rect x="60" y="55" width="240" height="90" rx="12" fill="white" stroke="#087f8c" stroke-width="1.5"/><rect x="60" y="70" width="4" height="60" rx="2" fill="#087f8c"/><text x="78" y="90" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">原始研究数据</text><text x="78" y="117" font-size="13" fill="#475569" font-weight="400" text-anchor="start">数据库 / Parquet 归档</text><circle cx="286" cy="69" r="3" fill="#087f8c"/></g><g class="node" data-id="catalog" tabindex="0" role="button" aria-pressed="false" aria-label="数据说明与历史可见性"><title>字段、物理绑定、可见日期和修订来源组成数据约定。</title><rect x="440" y="55" width="240" height="90" rx="12" fill="white" stroke="#15803d" stroke-width="1.5"/><rect x="440" y="70" width="4" height="60" rx="2" fill="#15803d"/><text x="458" y="90" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">数据说明与历史可见性</text><text x="458" y="117" font-size="13" fill="#475569" font-weight="400" text-anchor="start">Catalog + PIT</text><circle cx="666" cy="69" r="3" fill="#15803d"/></g><g class="node" data-id="plan" tabindex="0" role="button" aria-pressed="false" aria-label="已准入的查询计划"><title>绑定查询、预算、输入来源与可见时点。</title><rect x="820" y="55" width="240" height="90" rx="12" fill="white" stroke="#2563eb" stroke-width="1.5"/><rect x="820" y="70" width="4" height="60" rx="2" fill="#2563eb"/><text x="838" y="90" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">已准入的查询计划</text><text x="838" y="117" font-size="13" fill="#475569" font-weight="400" text-anchor="start">来源与时间边界固定</text><circle cx="1046" cy="69" r="3" fill="#2563eb"/></g><g class="node" data-id="input" tabindex="0" role="button" aria-pressed="false" aria-label="正式输入工件"><title>普通路径经 provider 与数据平面生成列式工件；分钟扫描和归档快照使用各自入口。</title><rect x="60" y="285" width="240" height="90" rx="12" fill="white" stroke="#087f8c" stroke-width="1.5"/><rect x="60" y="300" width="4" height="60" rx="2" fill="#087f8c"/><text x="78" y="320" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">正式输入工件</text><text x="78" y="347" font-size="13" fill="#475569" font-weight="400" text-anchor="start">按约定取数并保存</text><circle cx="286" cy="299" r="3" fill="#087f8c"/></g><g class="node" data-id="compute" tabindex="0" role="button" aria-pressed="false" aria-label="因子、模型与仿真"><title>研究计算不自行回查未来数据。处理器拟合、信号与交易时点各有可见性约定。</title><rect x="440" y="285" width="240" height="90" rx="12" fill="white" stroke="#2563eb" stroke-width="1.5"/><rect x="440" y="300" width="4" height="60" rx="2" fill="#2563eb"/><text x="458" y="320" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">因子、模型与仿真</text><text x="458" y="347" font-size="13" fill="#475569" font-weight="400" text-anchor="start">消费正式输入</text><circle cx="666" cy="299" r="3" fill="#2563eb"/></g><g class="node" data-id="result" tabindex="0" role="button" aria-pressed="false" aria-label="Result：封存研究"><title>数值表及其支持事实一起封存，按结果身份查阅。</title><rect x="820" y="285" width="240" height="90" rx="12" fill="white" stroke="#087f8c" stroke-width="1.5"/><rect x="820" y="300" width="4" height="60" rx="2" fill="#087f8c"/><text x="838" y="320" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">Result：封存研究</text><text x="838" y="347" font-size="13" fill="#475569" font-weight="400" text-anchor="start">输入 + 输出 + 实现与参数</text><circle cx="1046" cy="299" r="3" fill="#087f8c"/></g><g class="node" data-id="verify" tabindex="0" role="button" aria-pressed="false" aria-label="独立 Verifier"><title>结果与输入都来自封存材料；验证不直接沿用生产算法的正确性结论。</title><rect x="820" y="515" width="240" height="90" rx="12" fill="white" stroke="#15803d" stroke-width="1.5"/><rect x="820" y="530" width="4" height="60" rx="2" fill="#15803d"/><text x="838" y="550" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">独立 Verifier</text><text x="838" y="577" font-size="13" fill="#475569" font-weight="400" text-anchor="start">读取 Result 后重新检查</text><circle cx="1046" cy="529" r="3" fill="#15803d"/></g><g class="node" data-id="vr" tabindex="0" role="button" aria-pressed="false" aria-label="VerificationResult"><title>单独保存并绑定对应 Result。检查通过仅适用于声明过的验证范围。</title><rect x="440" y="515" width="240" height="90" rx="12" fill="white" stroke="#15803d" stroke-width="1.5"/><rect x="440" y="530" width="4" height="60" rx="2" fill="#15803d"/><text x="458" y="550" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">VerificationResult</text><text x="458" y="577" font-size="13" fill="#475569" font-weight="400" text-anchor="start">明确 pass / fail 及发现</text><circle cx="666" cy="529" r="3" fill="#15803d"/></g><g class="node" data-id="report" tabindex="0" role="button" aria-pressed="false" aria-label="报告 / 开发反馈"><title>报告使用 Result 和 VerificationResult；反馈投影只允许已验证开发指标。</title><rect x="60" y="515" width="240" height="90" rx="12" fill="white" stroke="#b45309" stroke-width="1.5"/><rect x="60" y="530" width="4" height="60" rx="2" fill="#b45309"/><text x="78" y="550" font-size="17" fill="#0f172a" font-weight="700" text-anchor="start">报告 / 开发反馈</text><text x="78" y="577" font-size="13" fill="#475569" font-weight="400" text-anchor="start">同一份研究证据的不同读法</text><circle cx="286" cy="529" r="3" fill="#b45309"/></g></svg>
