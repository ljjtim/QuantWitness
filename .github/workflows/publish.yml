name: publish

"on":
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  plan:
    name: Check version release request
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      candidate_commit: ${{ steps.plan.outputs.candidate_commit }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Download CI version request
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: version-release-request-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/release-request
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Check version change
        id: plan
        env:
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          python tools/plan_version_release.py
          --request "$RUNNER_TEMP/release-request/version-release-request.json"
          --candidate-commit "$CANDIDATE_SHA"
          --github-output "$GITHUB_OUTPUT"
          --notes-output "$RUNNER_TEMP/quantwitness-release-notes.md"
      - name: Upload release notes
        if: ${{ steps.plan.outputs.publish == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-notes
          path: ${{ runner.temp }}/quantwitness-release-notes.md
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build and verify release
    needs: plan
    if: ${{ needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
      CANDIDATE_SHA: ${{ needs.plan.outputs.candidate_commit }}
    outputs:
      wheel_name: ${{ steps.release.outputs.wheel_name }}
      sdist_name: ${{ steps.release.outputs.sdist_name }}
      source_archive_name: ${{ steps.release.outputs.source_archive_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.candidate_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install release test dependencies
        run: |
          python -m pip install ".[test]" "pyarrow==21.0.0"
          python -m pip check
      - name: Verify release tag
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} 与项目版本 {version!r} 不一致")
          PY
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: Check public source inventory
        run: python tools/public_source_inventory.py --project . --check
      - name: Run release contract tests
        run: >-
          python -m pytest -q
          tests/test_current_documentation.py
          tests/test_public_source_inventory.py
          tests/test_public_release_gates.py
          tests/test_version_release_plan.py
          tests/test_release_envelope.py
          tests/test_release_gate_runner.py
          tests/test_capability_release_evidence.py
          tests/test_release_workflows.py
          tests/test_gate_c_evidence.py
      - name: Build release artifacts
        id: release
        shell: bash
        run: |
          python tools/build_release_artifacts.py --project . --output "$RUNNER_TEMP/quantwitness-release" > "$RUNNER_TEMP/quantwitness-build.json"
          python - "$RUNNER_TEMP/quantwitness-build.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          from pathlib import Path
          import sys

          receipt = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if receipt.get("status") != "pass":
              raise SystemExit("正式构建未通过")
          names = ("wheel", "sdist", "source_archive")
          paths = {name: Path(receipt[name]).resolve(strict=True) for name in names}
          parents = {path.parent for path in paths.values()}
          if len(parents) != 1 or set(paths.values()) != set(next(iter(parents)).iterdir()):
              raise SystemExit("正式构建目录必须只包含本次三个发行产物")
          with Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              for name, path in paths.items():
                  print(f"{name}={path}", file=output)
                  print(f"{name}_name={path.name}", file=output)
          PY
      - name: Verify isolated wheel
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/quantwitness-release-env"
          python_bin="$RUNNER_TEMP/quantwitness-release-env/bin/python"
          "$python_bin" -m pip install "${{ steps.release.outputs.wheel }}[test]" "pyarrow==21.0.0"
          "$python_bin" -m pip check
          cd "$RUNNER_TEMP"
          "$python_bin" -c 'import importlib.metadata as m, os, research_pipeline; assert m.version("quantwitness") == os.environ["RELEASE_TAG"][1:]'
          "$RUNNER_TEMP/quantwitness-release-env/bin/quantwitness" --help
      - name: Upload Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: |
            ${{ steps.release.outputs.wheel }}
            ${{ steps.release.outputs.sdist }}
          if-no-files-found: error
          retention-days: 7
      - name: Upload source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-archive
          path: ${{ steps.release.outputs.source_archive }}
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/quantwitness
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - name: Publish Python distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist

  finalize-release:
    name: Verify PyPI installation and create GitHub Release
    needs: [plan, build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set up minimum supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.10"
      - name: Verify clean PyPI installation
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
        run: |
          python -m venv "$RUNNER_TEMP/quantwitness-pypi-env"
          python_bin="$RUNNER_TEMP/quantwitness-pypi-env/bin/python"
          version="${RELEASE_TAG#v}"
      
          # PyPI 上传完成后，simple index/CDN 可能需要一点时间同步。
          # 每 15 秒尝试一次，最多尝试 12 次。
          installed=false
      
          for attempt in $(seq 1 12); do
            echo "Attempt $attempt/12: installing quantwitness==$version from PyPI"
      
            if "$python_bin" -m pip install \
                --no-cache-dir \
                --index-url https://pypi.org/simple \
                "quantwitness==$version"; then
              installed=true
              break
            fi
      
            if [ "$attempt" -lt 12 ]; then
              echo "quantwitness==$version is not available yet; retrying in 15 seconds..."
              sleep 15
            fi
          done
      
          if [ "$installed" != "true" ]; then
            echo "quantwitness==$version is still unavailable on PyPI after retries."
            exit 1
          fi
      
          "$python_bin" -m pip check
      
          cd "$RUNNER_TEMP"
      
          "$python_bin" - <<'PY'
          import importlib.metadata
          import os
          from pathlib import Path
          import sys
          import research_pipeline
      
          assert importlib.metadata.version("quantwitness") == os.environ["RELEASE_TAG"][1:]
          assert Path(research_pipeline.__file__).resolve().is_relative_to(
              Path(sys.prefix).resolve()
          )
          PY
      
          "$RUNNER_TEMP/quantwitness-pypi-env/bin/quantwitness" --help
      - name: Download Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-distributions
          path: dist
      - name: Download source archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: source-archive
          path: dist
      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-notes
          path: release-metadata
      - name: Create verified GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          CANDIDATE_SHA: ${{ needs.plan.outputs.candidate_commit }}
          WHEEL_PATH: dist/${{ needs.build.outputs.wheel_name }}
          SDIST_PATH: dist/${{ needs.build.outputs.sdist_name }}
          SOURCE_ARCHIVE_PATH: dist/${{ needs.build.outputs.source_archive_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          --target "$CANDIDATE_SHA"
          --title "QuantWitness ${RELEASE_TAG#v}"
          --notes-file release-metadata/quantwitness-release-notes.md
          "$WHEEL_PATH" "$SDIST_PATH" "$SOURCE_ARCHIVE_PATH"
